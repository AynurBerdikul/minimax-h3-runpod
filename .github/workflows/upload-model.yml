name: Upload model to Network Volume

on:
  workflow_dispatch:
    inputs:
      repo_id:
        description: "Hugging Face repository, e.g. Comfy-Org/MiniMax-H3"
        required: true
        type: string
      revision:
        description: "Branch/tag/commit"
        required: true
        default: "main"
        type: string
      path:
        description: "Model path including ComfyUI folder, e.g. loras/model.safetensors"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: upload-model-${{ inputs.repo_id }}-${{ inputs.path }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      RUNPOD_S3_ACCESS_KEY: ${{ secrets.RUNPOD_S3_ACCESS_KEY }}
      RUNPOD_S3_SECRET_KEY: ${{ secrets.RUNPOD_S3_SECRET_KEY }}
      RUNPOD_VOLUME_ID: ${{ secrets.RUNPOD_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT: ${{ secrets.RUNPOD_S3_ENDPOINT }}
      RUNPOD_S3_REGION: ${{ secrets.RUNPOD_S3_REGION }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check boto3 requests
      - name: Stream model cloud-to-cloud
        run: >-
          python tools/upload_hf_model.py
          --repo-id "${{ inputs.repo_id }}"
          --revision "${{ inputs.revision }}"
          --path "${{ inputs.path }}"
