name: Delete single model from RunPod Volume

on:
  workflow_dispatch:
    inputs:
      model_path:
        description: "Exact model path to delete"
        required: true
        default: "models/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors"

permissions:
  contents: read

jobs:
  delete-model:
    runs-on: ubuntu-latest

    env:
      RUNPOD_S3_ACCESS_KEY: ${{ secrets.RUNPOD_S3_ACCESS_KEY }}
      RUNPOD_S3_SECRET_KEY: ${{ secrets.RUNPOD_S3_SECRET_KEY }}
      RUNPOD_VOLUME_ID: ${{ secrets.RUNPOD_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT: ${{ secrets.RUNPOD_S3_ENDPOINT }}
      RUNPOD_S3_REGION: ${{ secrets.RUNPOD_S3_REGION }}

    steps:
      - name: Install boto3
        run: python -m pip install --disable-pip-version-check boto3

      - name: Delete exactly one model
        shell: bash
        env:
          MODEL_PATH: ${{ inputs.model_path }}
        run: |
          python - <<'PY'
          import os
          import boto3

          key = os.environ["MODEL_PATH"]

          # Safety: only allow a single safetensors file under models/
          if not key.startswith("models/"):
              raise SystemExit("REFUSED: path must start with models/")

          if not key.endswith(".safetensors"):
              raise SystemExit("REFUSED: only .safetensors files are allowed")

          if ".." in key or key.endswith("/"):
              raise SystemExit("REFUSED: unsafe path")

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["RUNPOD_S3_ENDPOINT"],
              region_name=os.environ["RUNPOD_S3_REGION"],
              aws_access_key_id=os.environ["RUNPOD_S3_ACCESS_KEY"],
              aws_secret_access_key=os.environ["RUNPOD_S3_SECRET_KEY"],
          )

          bucket = os.environ["RUNPOD_VOLUME_ID"]

          # Verify the exact file exists before deleting
          obj = s3.head_object(Bucket=bucket, Key=key)
          size_gb = obj["ContentLength"] / 1024**3

          print(f"Found: {key}")
          print(f"Size: {size_gb:.2f} GB")
          print("Deleting exactly this object...")

          s3.delete_object(Bucket=bucket, Key=key)

          # Verify deletion
          try:
              s3.head_object(Bucket=bucket, Key=key)
          except Exception:
              print("SUCCESS: file deleted.")
          else:
              raise SystemExit("ERROR: file still exists after delete.")
          PY
