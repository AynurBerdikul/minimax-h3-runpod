name: Cleanup RunPod Volume

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually abort stale multipart uploads"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      RUNPOD_S3_ACCESS_KEY: ${{ secrets.RUNPOD_S3_ACCESS_KEY }}
      RUNPOD_S3_SECRET_KEY: ${{ secrets.RUNPOD_S3_SECRET_KEY }}
      RUNPOD_VOLUME_ID: ${{ secrets.RUNPOD_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT: ${{ secrets.RUNPOD_S3_ENDPOINT }}
      RUNPOD_S3_REGION: ${{ secrets.RUNPOD_S3_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --disable-pip-version-check boto3

      - name: Inspect or clean volume
        shell: bash
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            python tools/cleanup_runpod_volume.py --apply
          else
            python tools/cleanup_runpod_volume.py
          fi
