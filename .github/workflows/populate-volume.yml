name: Populate Wan 2.2 Network Volume

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "model_manifest.json"
      - "tools/populate_volume.py"
      - "tools/verify_volume.py"
      - ".github/workflows/populate-volume.yml"

permissions:
  contents: read

concurrency:
  group: populate-wan-2-2-volume
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - label: VACE-high
            file: diffusion_models/wan2.2_fun_vace_high_noise_14B_fp8_scaled.safetensors
          - label: VACE-low
            file: diffusion_models/wan2.2_fun_vace_low_noise_14B_fp8_scaled.safetensors
          - label: InP-high
            file: diffusion_models/wan2.2_fun_inpaint_high_noise_14B_fp8_scaled.safetensors
          - label: InP-low
            file: diffusion_models/wan2.2_fun_inpaint_low_noise_14B_fp8_scaled.safetensors
          - label: UMT5
            file: text_encoders/umt5_xxl_fp8_e4m3fn_scaled.safetensors
          - label: VAE
            file: vae/wan_2.1_vae.safetensors
          - label: CLIP-Vision
            file: clip_vision/clip_vision_h.safetensors

    env:
      RUNPOD_S3_ACCESS_KEY: ${{ secrets.RUNPOD_S3_ACCESS_KEY }}
      RUNPOD_S3_SECRET_KEY: ${{ secrets.RUNPOD_S3_SECRET_KEY }}
      RUNPOD_VOLUME_ID: ${{ secrets.RUNPOD_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT: ${{ secrets.RUNPOD_S3_ENDPOINT }}
      RUNPOD_S3_REGION: ${{ secrets.RUNPOD_S3_REGION }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check boto3 requests
      - name: Upload or resume ${{ matrix.label }}
        run: python tools/populate_volume.py --file "${{ matrix.file }}"

  verify:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNPOD_S3_ACCESS_KEY: ${{ secrets.RUNPOD_S3_ACCESS_KEY }}
      RUNPOD_S3_SECRET_KEY: ${{ secrets.RUNPOD_S3_SECRET_KEY }}
      RUNPOD_VOLUME_ID: ${{ secrets.RUNPOD_VOLUME_ID }}
      RUNPOD_S3_ENDPOINT: ${{ secrets.RUNPOD_S3_ENDPOINT }}
      RUNPOD_S3_REGION: ${{ secrets.RUNPOD_S3_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check boto3
      - run: python tools/verify_volume.py
