name: Build and deploy H3 RunPod image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "scripts/**"
      - "remote/**"
      - "tools/deploy_endpoint_image.py"
      - "extra_model_paths.yaml"
      - "model_manifest.json"
      - ".github/workflows/build-ghcr.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-deploy-h3-runpod
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      RUNPOD_ENDPOINT_ID: 2qdqfqf67tm4y5
      RUNPOD_IMAGE_NAME: ghcr.io/aynurberdikul/minimax-h3-runpod:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static Python checks
        run: |
          python -m py_compile \
            remote/handler-h3.py \
            scripts/validate_volume.py \
            tools/deploy_endpoint_image.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/aynurberdikul/minimax-h3-runpod:${{ github.sha }}
            ghcr.io/aynurberdikul/minimax-h3-runpod:latest

      - name: Deploy immutable image to existing RunPod endpoint
        if: ${{ env.RUNPOD_API_KEY != '' }}
        run: |
          python -m pip install --disable-pip-version-check requests
          python tools/deploy_endpoint_image.py

      - name: Deployment secret missing
        if: ${{ env.RUNPOD_API_KEY == '' }}
        run: |
          echo "Image built successfully, but RUNPOD_API_KEY GitHub secret is missing."
          echo "Add it once so future builds update the existing endpoint automatically."
          exit 1
